services:
  - type: web
    name: iphuboficial
    runtime: node
    buildCommand: npm install --omit=dev
    startCommand: node start.js
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: APP_URL
        value: https://iphuboficial.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: AUTO_VERIFY_ON_SMTP_FAIL
        value: "1"
      # Link de descarga del exe (GitHub Releases), así no va dentro del repo:
      - key: EXE_URL
        sync: false
      # Para que no se pierdan usuarios/roles al reiniciar: disco persistente (plan pago) montado en /var/data
      # y variable DB_PATH=/var/data/iphub-db.json
      # En el panel de Render agregá también:
      # SMTP_USER, SMTP_PASS (App Password Gmail)
      # GROQ_API_KEY (chatbot)
      # SUPPORT_TO
