<title>IPHub</title>
<style>
:root{--p:#0a1628;--s:#1a0b2e;--t:#e2e8f0;--m:#94a3b8;--ok:#10b981;--warn:#f59e0b;--bad:#ef4444;--c:#06b6d4;--line:rgba(255,255,255,.08)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(160deg,var(--p),var(--s)) fixed;color:var(--t);min-height:100vh;padding:1.2rem 1.5rem 2rem}
header{display:flex;align-items:center;gap:.9rem;margin-bottom:1rem;flex-wrap:wrap}
.logo{width:46px;height:46px;flex:none}.logo img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 4px 14px rgba(6,182,212,.35))}
h1{font-size:1.3rem}h1 small{display:block;font-size:.78rem;color:var(--m);font-weight:400;margin-top:.1rem}
.sp{flex:1}
input,select{background:rgba(15,23,42,.8);border:1px solid var(--line);color:var(--t);border-radius:999px;padding:.5rem .9rem;font:inherit;font-size:.85rem;outline:none}
input:focus,select:focus{border-color:#3b82f6}
#q{width:300px}
.btn{border:0;border-radius:999px;padding:.5rem 1rem;font-weight:600;font-size:.84rem;cursor:pointer;background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff;font-family:inherit}
.btn:disabled{opacity:.55;cursor:default}
.btn.g{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:var(--t)}
.btn.ok{background:rgba(16,185,129,.22);color:#6ee7b7}
.btn.bad{background:rgba(239,68,68,.22);color:#fca5a5}
.btn.sm{padding:.3rem .65rem;font-size:.76rem}
#prog{height:3px;background:rgba(255,255,255,.06);border-radius:9px;margin-bottom:1rem;overflow:hidden;opacity:0;transition:opacity .2s}
#prog.on{opacity:1}#prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3b82f6,#8b5cf6);transition:width .3s}
.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:.8rem;margin-bottom:.9rem}
.card{background:rgba(15,23,42,.75);border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem}
.card h4{color:var(--m);font-size:.74rem;font-weight:500;margin-bottom:.3rem}
.card .v{font-size:1.5rem;font-weight:700}.card .v small{font-size:.78rem;color:var(--m);font-weight:500}
.bar{height:6px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;margin-top:.45rem}.bar>i{display:block;height:100%;border-radius:99px}
.net{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.55rem 1.2rem;margin-bottom:.9rem}
.net div{font-size:.82rem}.net b{display:block;color:var(--m);font-weight:500;font-size:.7rem;margin-bottom:.1rem}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:.78rem}
.tools{display:flex;flex-wrap:wrap;gap:.45rem;align-items:center;margin-bottom:.7rem}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--m);border-radius:999px;padding:.3rem .8rem;font-size:.78rem;cursor:pointer;font-family:inherit}
.chip.on{background:rgba(59,130,246,.25);color:#bfdbfe;border-color:#3b82f6}
label.ck{font-size:.78rem;color:var(--m);display:flex;gap:.35rem;align-items:center;cursor:pointer}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th{text-align:left;color:var(--m);font-weight:500;padding:.5rem .5rem;border-bottom:1px solid var(--line);white-space:nowrap;font-size:.74rem}
td{padding:.55rem .5rem;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:middle}
tr.r{cursor:pointer}tr.r:hover td{background:rgba(255,255,255,.035)}tr.off td{opacity:.5}tr.sel td{background:rgba(59,130,246,.12)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:.45rem}.off .dot{background:#64748b}
.tag{display:inline-block;padding:.08rem .5rem;border-radius:999px;font-size:.68rem;font-weight:700;margin-left:.3rem;white-space:nowrap}
.tag.ok{background:rgba(16,185,129,.2);color:#6ee7b7}.tag.warn{background:rgba(245,158,11,.2);color:#fcd34d}.tag.bad{background:rgba(239,68,68,.2);color:#fca5a5}.tag.me{background:rgba(59,130,246,.25);color:#93c5fd}.tag.new{background:rgba(139,92,246,.28);color:#c4b5fd}.tag.mut{background:rgba(148,163,184,.18);color:var(--m)}
.pt{display:inline-block;font-size:.68rem;padding:.05rem .4rem;border-radius:6px;background:rgba(255,255,255,.07);margin:0 .2rem .15rem 0;color:var(--m)}.pt.h{background:rgba(239,68,68,.2);color:#fca5a5}.pt.m{background:rgba(245,158,11,.2);color:#fcd34d}
.muted{color:var(--m)}
#dr{position:fixed;top:0;right:0;height:100vh;width:430px;max-width:96vw;background:#0d1b33;border-left:1px solid var(--line);padding:1.1rem 1.2rem 2rem;overflow-y:auto;transform:translateX(105%);transition:transform .2s;z-index:5;box-shadow:-10px 0 30px rgba(0,0,0,.35)}
#dr.on{transform:none}
#dr h2{font-size:1.1rem;margin-bottom:.15rem}#dr h3{font-size:.72rem;color:var(--c);text-transform:uppercase;letter-spacing:.06em;margin:1rem 0 .4rem}
.kv{display:grid;grid-template-columns:130px 1fr;gap:.3rem .7rem;font-size:.82rem}.kv span:nth-child(odd){color:var(--m)}.kv span{word-break:break-word}
.pr{padding:.4rem 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:.8rem}.pr small{display:block;color:var(--m);font-size:.72rem;margin-top:.1rem;word-break:break-word}
.acts{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.8rem}
#dr textarea{width:100%;background:rgba(15,23,42,.8);border:1px solid var(--line);color:var(--t);border-radius:10px;padding:.5rem .7rem;font:inherit;font-size:.82rem;resize:vertical;min-height:56px;outline:none}
#toast{position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%);background:#1e293b;border:1px solid var(--line);padding:.5rem 1rem;border-radius:999px;font-size:.82rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}#toast.on{opacity:1}
.foot{margin-top:1rem;color:var(--m);font-size:.76rem}
@media(max-width:1200px){.cards{grid-template-columns:repeat(3,1fr)}}

.vsw{display:inline-flex;gap:2px;background:rgba(15,23,42,.8);border:1px solid var(--line);border-radius:999px;padding:3px;margin-bottom:.7rem}
.vsw button{background:none;border:0;color:var(--m);padding:.4rem 1.1rem;border-radius:999px;font:inherit;font-size:.82rem;cursor:pointer;transition:.15s}
.vsw button.on{background:linear-gradient(135deg,#06b6d4,#8b5cf6);color:#fff;font-weight:600;box-shadow:0 2px 12px rgba(6,182,212,.35)}
#mapbox{position:relative;display:none;height:min(68vh,640px);min-height:420px;border-radius:12px;overflow:hidden;margin-top:.7rem;border:1px solid var(--line);background:radial-gradient(ellipse at center,rgba(6,182,212,.10),transparent 62%),radial-gradient(circle,rgba(148,163,184,.10) 1px,transparent 1px) 0 0/26px 26px,rgba(8,13,26,.92)}
#mapc{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#mtip{position:absolute;pointer-events:none;display:none;background:rgba(15,23,42,.96);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:.5rem .7rem;font-size:.78rem;line-height:1.5;max-width:250px;box-shadow:0 8px 24px rgba(0,0,0,.45);z-index:3}
.mctl{position:absolute;right:.7rem;top:.7rem;display:flex;flex-direction:column;gap:.35rem;z-index:2}
.mctl button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:rgba(15,23,42,.85);color:var(--t);cursor:pointer;font-size:1rem}
.mctl button:hover{border-color:var(--c)}
.mleg{position:absolute;left:.8rem;bottom:.7rem;display:flex;gap:.9rem;flex-wrap:wrap;font-size:.72rem;color:var(--m);background:rgba(15,23,42,.72);padding:.35rem .8rem;border-radius:999px;border:1px solid var(--line);z-index:2}
.mleg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:.35rem}
.mhint{position:absolute;left:.9rem;top:.7rem;font-size:.72rem;color:var(--m);z-index:2}

@keyframes aur{0%{background-position:0% 0%,100% 0%,50% 100%}100%{background-position:12% 8%,88% 10%,45% 92%}}
body{background:radial-gradient(40% 35% at 15% 20%,rgba(129,140,248,.20),transparent 70%) 0 0/200% 200% no-repeat,radial-gradient(35% 30% at 85% 15%,rgba(6,182,212,.16),transparent 70%) 0 0/200% 200% no-repeat,linear-gradient(160deg,var(--p),var(--s)) fixed;animation:aur 22s ease-in-out infinite alternate}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
header,#mapbox,.card,section{animation:up .6s cubic-bezier(.22,1,.36,1) both}
button,.btn{transition:transform .25s cubic-bezier(.22,1,.36,1),box-shadow .25s,filter .25s,border-color .25s}button:hover,.btn:hover{transform:translateY(-2px)}button:active,.btn:active{transform:scale(.97)}
input{transition:border-color .25s,box-shadow .25s}input:focus{outline:none;border-color:var(--c)!important;box-shadow:0 0 0 3px rgba(6,182,212,.18)}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:rgba(129,140,248,.3);border-radius:99px}

function mapSync(list) {

function mapStep() {
  const ns = [...MAP.nodes.values()], dn = MAP.drag && MAP.drag.n;
  for (let i = 0; i < ns.length; i++) for (let j = i + 1; j < ns.length; j++) {
    const a = ns[i], b = ns[j]; let dx = b.x - a.x, dy = b.y - a.y; const min = a.r + b.r + 34, d2 = dx * dx + dy * dy;
    if (d2 < min * min) { const d = Math.sqrt(d2) || .01, f = (min - d) * .04; dx /= d; dy /= d; if (!a.hub && a !== dn) { a.vx -= dx * f; a.vy -= dy * f; } if (!b.hub && b !== dn) { b.vx += dx * f; b.vy += dy * f; } }
  }
  for (const n of ns) {
    if (n.hub || n === dn) { n.vx = n.vy = 0; continue; }
    n.vx += (n.tx - n.x) * .012; n.vy += (n.ty - n.y) * .012; n.vx *= .82; n.vy *= .82; n.x += n.vx; n.y += n.vy;
  }
}
function mapDraw(now) {
  const cv = $('mapc'); if (!cv || !MAP.w) return;
  const g = cv.getContext('2d'), cam = MAP.cam, dpr = MAP.dpr;
  g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, MAP.w, MAP.h);
  g.setTransform(dpr * cam.k, 0, 0, dpr * cam.k, dpr * cam.x, dpr * cam.y);
  const hub = MAP.nodes.get(MAP.hubKey), active = MAP.hover || (sel && MAP.nodes.get(sel)) || null;
  if (hub) { g.lineWidth = 1; [175, 237, 299].forEach(r => { g.beginPath(); g.arc(hub.x, hub.y, r, 0, 7); g.strokeStyle = 'rgba(148,163,184,.08)'; g.stroke(); }); }
  if (hub) for (const n of MAP.nodes.values()) {
    if (n === hub) continue;
    const col = mcol(n.d), on = n.d.online, hl = active === n;
    g.beginPath(); g.moveTo(hub.x, hub.y); g.lineTo(n.x, n.y); g.lineWidth = hl ? 2.4 : 1.3;
    g.setLineDash(on ? [5, 9] : [2, 8]); g.lineDashOffset = on ? -(now / 45) % 14 : 0;
    g.strokeStyle = hl ? col : on ? col + '77' : 'rgba(100,116,139,.28)'; g.stroke();
  }
  g.setLineDash([]);
  for (const n of MAP.nodes.values()) {
    const d = n.d, col = n.hub ? '#06b6d4' : mcol(d), ph = (now / 1300 + n.x * .01) % 1, x = n.x, y = n.y + Math.sin(now / 1500 + n.x) * 1.6, r = n.r;
    if (d.online) { g.beginPath(); g.arc(x, y, r + 3 + ph * 13, 0, 7); g.strokeStyle = col + Math.round((1 - ph) * 80).toString(16).padStart(2, '0'); g.lineWidth = 1.6; g.stroke(); }
    g.save(); g.shadowColor = col; g.shadowBlur = active === n ? 30 : d.online ? 16 : 0;
    const gr = g.createRadialGradient(x - r * .3, y - r * .4, r * .2, x, y, r); gr.addColorStop(0, '#1e293b'); gr.addColorStop(1, '#0b1220');
    g.beginPath(); g.arc(x, y, r, 0, 7); g.fillStyle = gr; g.fill(); g.lineWidth = n.hub || d.me ? 3.2 : 2.4; g.strokeStyle = d.me ? '#a78bfa' : col; g.stroke(); g.restore();
    if (d.isNew && !d.me) { g.beginPath(); g.arc(x + r * .75, y - r * .75, 4.5, 0, 7); g.fillStyle = '#f472b6'; g.fill(); }
    if (sel === d.key) { g.beginPath(); g.arc(x, y, r + 6, 0, 7); g.strokeStyle = '#fff'; g.lineWidth = 1.6; g.setLineDash([4, 4]); g.stroke(); g.setLineDash([]); }
    g.globalAlpha = d.online ? 1 : .55; g.font = Math.round(r * 1.02) + 'px "Segoe UI Emoji","Apple Color Emoji",sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(d.isGateway ? '🌐' : (ICON[d.type] || '❔'), x, y + 1);
    if (cam.k > .55 || active === n) {
      g.textBaseline = 'alphabetic'; g.font = '600 11px "Segoe UI",system-ui,sans-serif'; g.fillStyle = '#e2e8f0'; g.fillText(nameOf(d) || d.ip, x, y + r + 15);
      if (cam.k > .85) { g.font = '10px ui-monospace,Consolas,monospace'; g.fillStyle = '#94a3b8'; g.fillText(d.ip, x, y + r + 28); }
    }
    g.globalAlpha = 1;
  }
}
function mapTick(now) { if (view !== 'map') { MAP.raf = 0; return; } mapStep(); mapDraw(now); MAP.raf = requestAnimationFrame(mapTick); }
function applyView() {
  document.querySelectorAll('#vsw [data-v]').forEach(b => b.classList.toggle('on', b.dataset.v === view));
  $('mapbox').style.display = view === 'map' ? 'block' : 'none';
  $('listwrap').style.display = view === 'map' ? 'none' : '';
  if (view === 'map') { MAP.fitted = false; render(); requestAnimationFrame(() => { mapResize(); mapFit(); if (!MAP.raf) MAP.raf = requestAnimationFrame(mapTick); }); }
}
(function mapInit() {
  const cv = $('mapc'), box = $('mapbox'), tip = $('mtip');
  const pos = e => { const b = cv.getBoundingClientRect(); return { x: e.clientX - b.left, y: e.clientY - b.top }; };
  const world = p => ({ x: (p.x - MAP.cam.x) / MAP.cam.k, y: (p.y - MAP.cam.y) / MAP.cam.k });
  const hit = p => { const w = world(p); let f = null; for (const n of MAP.nodes.values()) if (Math.hypot(n.x - w.x, n.y - w.y) <= n.r + 5) f = n; return f; };
  cv.addEventListener('pointerdown', e => {
    const p = pos(e), n = hit(p); cv.setPointerCapture(e.pointerId); MAP.moved = 0; tip.style.display = 'none';
    if (n) MAP.drag = { n, lx: p.x, ly: p.y }; else MAP.pan = { lx: p.x, ly: p.y }; cv.style.cursor = 'grabbing';
  });
  cv.addEventListener('pointermove', e => {
    const p = pos(e);
    if (MAP.drag) { const n = MAP.drag.n; MAP.moved += Math.abs(p.x - MAP.drag.lx) + Math.abs(p.y - MAP.drag.ly); MAP.drag.lx = p.x; MAP.drag.ly = p.y; if (!n.hub && MAP.moved > 4) { const w = world(p); n.x = n.tx = w.x; n.y = n.ty = w.y; } return; }
    if (MAP.pan) { MAP.cam.x += p.x - MAP.pan.lx; MAP.cam.y += p.y - MAP.pan.ly; MAP.moved += Math.abs(p.x - MAP.pan.lx) + Math.abs(p.y - MAP.pan.ly); MAP.pan.lx = p.x; MAP.pan.ly = p.y; return; }
    const n = hit(p); MAP.hover = n; cv.style.cursor = n ? 'pointer' : 'grab';
    if (!n) { tip.style.display = 'none'; return; }
    const d = n.d;
    tip.innerHTML = `<b>${esc(nameOf(d) || d.ip)}</b><br><span class="mono">${esc(d.ip)}</span>${d.mac ? ' · <span class="mono">' + esc(d.mac) + '</span>' : ''}<br>${esc(typeTxt(d))}${d.vendor ? ' · ' + esc(d.vendor) : ''}<br><span style="color:${mcol(d)}">●</span> ${esc(t(d.online ? 'f_online' : 'f_off'))}${(d.ports || []).length ? ' · ' + d.ports.length + ' ' + esc(t('th_ports')) : ''}`;
    tip.style.display = 'block'; tip.style.left = Math.min(p.x + 16, MAP.w - tip.offsetWidth - 8) + 'px'; tip.style.top = Math.min(p.y + 16, MAP.h - tip.offsetHeight - 8) + 'px';
  });
  const up = () => { const n = MAP.drag && MAP.drag.n; if (n && MAP.moved < 5) { sel = n.d.key; render(); drawer(); } MAP.drag = null; MAP.pan = null; cv.style.cursor = 'grab'; };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  cv.addEventListener('pointerleave', () => { MAP.hover = null; tip.style.display = 'none'; });
  cv.addEventListener('wheel', e => { e.preventDefault(); const p = pos(e), k0 = MAP.cam.k, k1 = Math.max(.25, Math.min(3, k0 * (e.deltaY < 0 ? 1.12 : 1 / 1.12))); MAP.cam.x = p.x - (p.x - MAP.cam.x) * k1 / k0; MAP.cam.y = p.y - (p.y - MAP.cam.y) * k1 / k0; MAP.cam.k = k1; }, { passive: false });
  cv.addEventListener('dblclick', e => { if (!hit(pos(e))) mapFit(); });
  box.addEventListener('click', e => {
    const z = e.target.closest('[data-mz]'); if (!z) return;
    if (z.dataset.mz === 'fit') return mapFit();
    const k0 = MAP.cam.k, k1 = Math.max(.25, Math.min(3, k0 * (z.dataset.mz === 'in' ? 1.25 : .8))), cx = MAP.w / 2, cy = MAP.h / 2;
    MAP.cam.x = cx - (cx - MAP.cam.x) * k1 / k0; MAP.cam.y = cy - (cy - MAP.cam.y) * k1 / k0; MAP.cam.k = k1;
  });
  document.addEventListener('click', e => { const b = e.target.closest('#vsw [data-v]'); if (b) { view = b.dataset.v; applyView(); } });
  if (window.ResizeObserver) new ResizeObserver(() => { if (view === 'map') mapResize(); }).observe(box);
})();

/* Todo botón con cooldown de 0,22 s */
document.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; const n = Date.now(); if (b._t && n - b._t < 220) { e.stopImmediatePropagation(); e.preventDefault(); return; } b._t = n; }, true);
document.addEventListener('click', async e => {
  const el = e.target;
  const f = el.closest('[data-f]'); if (f) { filter = f.dataset.f; $('tools').dataset.k = ''; return render(); }
  if (el.closest('[data-close]') && !el.closest('[data-a]')) { $('dr').classList.remove('on'); sel = null; return render(); }
  const ex = el.closest('[data-ex]'); if (ex) { await exportData(ex.dataset.ex); return; }
  const cp = el.closest('[data-copy]'); if (cp) { try { await navigator.clipboard.writeText(cp.dataset.copy); toast(t('copied')); } catch (_) {} return; }
  const op = el.closest('[data-open]'); if (op) { F('open', op.dataset.open); return; }
  const a = el.closest('[data-a]'); if (a) { const r = await F(a.dataset.a, a.dataset.k); if (a.dataset.a === 'wake') toast(t('wol')); if (a.dataset.close) { $('dr').classList.remove('on'); sel = null; } setState(r); return; }
  const row = el.closest('tr.r'); if (row) { sel = row.dataset.k; render(); drawer(); }
});
document.addEventListener('change', async e => { if (e.target.id === 'nt') setState(await F('setting', 'notify', e.target.checked)); });
$('q').addEventListener('input', e => { q = e.target.value.trim().toLowerCase(); render(); });
$('scan').onclick = async () => { $('scan').disabled = true; setState(await F('scan', true)); };
window.iphub.onState(setState);
F('summary').then(setState);
setInterval(() => { if (S && !S.scanning) render(); }, 30000);

async function cloudPaint(c) {
  c = c || await F('cloudStatus');
  const base = document.getElementById('cloud-base'); if (base && c && c.base && document.activeElement !== base) base.value = c.base;
  const msg = document.getElementById('cloud-msg');
  if (!msg) return; msg.style.color = '';
  if (c && c.user) msg.textContent = 'Conectado como ' + (c.user.name || c.user.email) + '. La página muestra esta red al abrir Topología.';
  else if (c && c.pending) msg.textContent = 'Esperando que confirmes en el navegador…';
  else msg.textContent = 'Iniciá sesión con la misma cuenta. Google y Discord abren la página para confirmar.';
}
document.getElementById('cloud-base').onchange = async e => { const c = await F('cloudBase', e.target.value); cloudPaint(c); toast('Dirección guardada'); };
document.getElementById('cloud-login').onclick = async () => {
  const b = document.getElementById('cloud-login'), msg = document.getElementById('cloud-msg'); b.disabled = true; const old = b.textContent; b.textContent = 'Conectando…';
  msg.style.color = ''; msg.textContent = 'Conectando con la página… (si estaba dormida puede tardar hasta ~1 min)';
  try {
    const c = await F('cloudLogin', { email: document.getElementById('cloud-email').value, password: document.getElementById('cloud-pass').value });
    if (!c || c.error || !c.user) throw new Error((c && c.error) || 'No se pudo entrar');
    cloudPaint(c); toast('Cuenta conectada');
  } catch (e) { msg.style.color = '#f87171'; msg.textContent = '✕ ' + (e.message || 'No se pudo entrar'); toast(e.message || 'No se pudo entrar'); }
  finally { b.disabled = false; b.textContent = old; }
};
async function cloudSocial() {
  try {
    const d = await F('cloudLink', {});
    cloudPaint({ pending: d.code });
    toast('Confirmá en el navegador');
    for (let i = 0; i < 40; i++) {
      await new Promise(r => setTimeout(r, 2000));
      const c = await F('cloudPoll', d.code);
      if (c && c.user) { cloudPaint(c); toast('Exe conectado'); return; }
    }
  } catch (e) { toast(e.message || 'No se pudo abrir la página'); }
}
document.getElementById('cloud-google').onclick = cloudSocial;
document.getElementById('cloud-discord').onclick = cloudSocial;
document.getElementById('cloud-out').onclick = async () => { cloudPaint(await F('cloudLogout')); };
document.getElementById('cloud-file').onclick = async () => {
  const rows = Object.values((S && S.devices) || {});
  const content = JSON.stringify({ iphub: 1, exportedAt: new Date().toISOString(), host: (S && S.host) || '', summary: S, devices: rows }, null, 2);
  const r = await F('export', { name: 'iphub-red.json', content });
  if (r && r.ok) toast('Archivo listo para importar en Topología');
};
cloudPaint();
